[tool.poetry]
name = "shop_engine"
version = "0.1.0"
description = "Core modular e-commerce engine for product and category management."
authors = ["Александр (Jakevirtus) <alexanderlebedev339@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
flake8 = "^7.5.0"
isort = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"
line_length = 100
